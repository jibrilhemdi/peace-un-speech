id: imperialism
version: 1
title: Symmetry of control in the proposed settlement
theory: >
  Galtung (1971), "A Structural Theory of Imperialism": relations between parties are
  vertical when one defines the terms and the other complies, horizontal when the parties set
  terms jointly. The scale records how far a speaker's proposed settlement sits toward the
  vertical (asymmetric) or horizontal (symmetric) pole — who is treated as the author of the
  arrangement, and who merely as its subject.
unit: paragraph
allow_multiple_annotations: true
max_annotations_per_unit: 4

instructions: >
  Code the speaker's own framing, not the underlying facts. Most paragraphs of a
  Security Council speech engage no construct at all and correctly receive no
  annotation.



dimensions:
  - name: imperialism
    scale: ordinal
    score_aggregation: max   # how several steps on one paragraph collapse
    description: >   # TODO: say what the VARIABLE measures, not what the codes mean
      
    required: true
    categories:

      - code: I0
        value: 0
        label: "Total asymmetry"
        definition: >
          One party dictates absolute terms, the other party must submit to external benchmarks.
        # TODO: add includes/excludes boundaries
        positive_examples:
          - text: >
              There will be a future for Gaza only when Hamas is out of the equation.
            source: "Danon (Israel)"
            reasoning: >
              There are absolute conditions imposed by the external party (Israel) to the
              occupied (Palestine), with absolute conditions that cannot be negotiated. Avoiding
              technical and specific perspectives such as hostage release, etc., but immediately
              judging and having a total and absolute vision without negotiation.
        # TODO: negative_examples — spans that look like this code but are not.
        negative_examples: []

      - code: I1
        value: 1
        label: "Predominantly asymmetric"
        definition: >
          The solution framework is externally designed, conditional, and externally supervised
          (despite being labeled “local”).
        # TODO: add includes/excludes boundaries
        positive_examples:
          - text: >
              This process also requires renewed and reformed Palestinian governance... The
              European Union... will make its future cooperation conditional on these
              commitments.
            source: "S/PV.10003, Dharmadhikari (France)"
            reasoning: >
              The reform and compliance framework is dictated by external standards
              (EU/International Law), local parties are only asked to fulfill commitments.
          - text: >
              ...we urge Israel to effectively adhere to its obligations under international
              humanitarian law.
            source: "S/PV.9442, Zhang Jun (China)"
            reasoning: >
              The reform and compliance framework is dictated by external standards
              (EU/International Law), local parties are only asked to fulfill commitments.
        # TODO: negative_examples — spans that look like this code but are not.
        negative_examples: []

      - code: I2
        value: 2
        label: "Mixed / negotiated"
        definition: >
          External parties facilitate, but solutions emerge from negotiation and accommodation
          of opposing positions.
        # TODO: add includes/excludes boundaries
        positive_examples:
          - text: >
              It is a reminder that solutions are forged not in the fires of war but at the
              negotiating table.
            source: "Abushahab (United Arab Emirates)"
            reasoning: >
              Talking about the importance of bilateral negotiations, not war. There's even a
              tendency to "remind" the other party of the importance of negotiations.
        # TODO: negative_examples — spans that look like this code but are not.
        negative_examples: []

      - code: I3
        value: 3
        label: "Predominantly equal"
        definition: >
          The affected party holds primary control (ownership), external parties only
          support/strengthen.
        # TODO: add includes/excludes boundaries
        positive_examples:
          - text: >
              The first task for all of us must be to empower Palestinian decision-making to
              carry out the administration of the Strip...
            source: "S/PV.10003, Mahmoud (Egypt)"
            reasoning: >
              Administrative and political control is explicitly placed in the hands of local
              authorities.
        # TODO: negative_examples — spans that look like this code but are not.
        negative_examples: []

      - code: I4
        value: 4
        label: "Full equality"
        definition: >
          Absolute autonomy, self-determination, firm rejection of asymmetrical/colonial
          relations.
        # TODO: add includes/excludes boundaries
        positive_examples:
          - text: >
              The Palestinians themselves must become masters of their own destiny.
            source: "S/PV.10003, Rasmussen (Denmark)"
            reasoning: >
              Philosophically rejecting all forms of domination, demanding absolute autonomy and
              ontological equality.
        # TODO: negative_examples — spans that look like this code but are not.
        negative_examples: []

