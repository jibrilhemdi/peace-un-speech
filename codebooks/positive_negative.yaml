id: positive_negative
version: 1
title: Negative and positive peace
theory: >
  Galtung (1964, 1969): negative peace is the absence of direct violence — the guns
  stop. Positive peace is the absence of structural violence — the arrangements that produced
  the harm are dismantled and replaced by justice and integration. The scale records how far
  beyond a ceasefire a speaker's vision of peace extends.
unit: paragraph
allow_multiple_annotations: true
max_annotations_per_unit: 4

instructions: >
  Code the speaker's own framing, not the underlying facts. Most paragraphs of a
  Security Council speech engage no construct at all and correctly receive no
  annotation.



dimensions:
  - name: positive_negative
    scale: ordinal
    score_aggregation: max   # how several steps on one paragraph collapse
    description: >   # TODO: say what the VARIABLE measures, not what the codes mean
      
    required: true
    categories:

      - code: PN0
        value: 0
        label: "Pure negative peace"
        definition: >
          Just demanding a ceasefire without any vision for the future.
        # TODO: add includes/excludes boundaries
        positive_examples:
          - text: >
              ...first, an immediate, unconditional and permanent ceasefire to halt the
              bloodshed...
            source: "S/PV.10003, Dar (Pakistan)"
            reasoning: >
              The narrative stops entirely at the physical cessation of bloodshed without
              including any vision of reconciliation or access.
          - text: >
              Let us declare a ceasefire — an unconditional and permanent ceasefire — not as a
