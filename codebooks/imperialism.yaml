# negative/positive peace (positive_negative), dissociative vs associative relations
# (relations), the structural theory of imperialism (imperialism), and the TRANSCEND
# method (transcend). They are facets of one framework, not independent instruments —
# see the note on theoretical coupling in README.md before treating them as separate
# indicators in an MCA or latent class model.
