# --------------------------------------------------------------------------------------
# Export
# --------------------------------------------------------------------------------------
export:
  # Country profiles denominator: paragraphs that are non-procedural at BOTH levels.
  exclude_procedural_paragraphs: true
  # Countries with fewer than this many annotated paragraphs get a `sparse` flag in
  # country_profiles.parquet. Not dropped — flagged, so the choice stays yours.
  sparse_country_min_units: 30
