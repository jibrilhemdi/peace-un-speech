id: transcend
version: 1
title: Transcendence of the conflict
theory: >
  Galtung, the TRANSCEND method (Galtung 2004, "Transcend and Transform"): a conflict
  over incompatible goals admits five outcomes — one party prevails, the other prevails,
  withdrawal, compromise, or transcendence, in which a new formulation lets both parties reach
  their underlying goals. The scale runs from either/or (one party's goals require the other's
  defeat) to both/and (both are met simultaneously).
unit: paragraph
allow_multiple_annotations: true
max_annotations_per_unit: 4

instructions: >
  Code the speaker's own framing, not the underlying facts. Most paragraphs of a
  Security Council speech engage no construct at all and correctly receive no
  annotation.



dimensions:
  - name: transcend
    scale: ordinal
    score_aggregation: max   # how several steps on one paragraph collapse
    description: >   # TODO: say what the VARIABLE measures, not what the codes mean
      
    required: true
    categories:

      - code: T0
        value: 0
        label: "Either/Or (Zero-sum)"
        definition: >
          One party wins completely, the other party must be absent/total submission.
        # TODO: add includes/excludes boundaries
        positive_examples:
          - text: >
              As long as Hamas exists, there will be no peace in the Middle East.
            source: "S/PV.10003, Waltz (United States)"
            reasoning: >
              Absolute zero-sum vision: peace ontologically requires the non-existence or total
              defeat of the other party.
        # TODO: negative_examples — spans that look like this code but are not.
        negative_examples: []

      - code: T1
        value: 1
        label: "Leaning zero-sum"
        definition: >
          One party's demands are dominant, the other party's legitimacy is rejected or
          marginalized.
        # TODO: add includes/excludes boundaries
        positive_examples:
          - text: >
              The Palestinian Authority leaders... failed to meet their Oslo commitments... This
              charade is disappointing...
            source: "S/PV.10003, Waltz (United States)"
            reasoning: >
              Marginalizing the legitimate goals of others and dictating what they should focus
              on, or monopolizing morality.
        # TODO: negative_examples — spans that look like this code but are not.
        negative_examples: []

      - code: T2
        value: 2
        label: "Compromise"
        definition: >
          ONLY mutual exchange to reach the middle point.
        # TODO: add includes/excludes boundaries
        positive_examples:
          - text: >
              ...preserve the broadest possible agreement that was found to guide us in a common
              direction.
            source: "S/PV.9442, Agyeman (Ghana)"
            reasoning: >
              The essence of diplomatic compromise: accommodating opposing positions to reach a
              broadest agreement.
        # TODO: negative_examples — spans that look like this code but are not.
        negative_examples: []

      - code: T3
        value: 3
        label: "Leaning both/and"
        definition: >
          Both goals are recognized as legitimate and mutually conditional (inseparable).
        # TODO: add includes/excludes boundaries
        positive_examples:
          - text: >
              The international community must urgently rally to ensure the fulfilment of
              Palestinian aspirations for statehood and self-determination, together with
              assurances for Israel's security.
            source: "Frazie (Malta)"
            reasoning: >
              It has been stated that both parties must win and respect both Palestinian
              statehood and Israeli security. However, overall, this can still be seen as merely
              an "ideal" dream rather than a vision of a cooperative peace solution between the
              two parties. It doesn't mention what technical solutions both parties can
              implement to achieve their goals, nor does it mention whether achieving one will
              have a cost to the other.
        # TODO: negative_examples — spans that look like this code but are not.
        negative_examples: []

      - code: T4
        value: 4
        label: "Both/And (Transcend)"
        definition: >
          Both parties achieve their main goals simultaneously (creative solution).
        # TODO: add includes/excludes boundaries
        positive_examples:
          - text: >
              ...We believe that the Palestinian people and the Israeli people have an
              inalienable right to statehood. They can live together, side by side, in peace and
              security, as good neighbours. As a matter of fact, the Charter of the United
              Nations compels the parties and indeed the entire international community to
              practice tolerance and live together in peace with one another as good neighbours
            source: "S/PV.9442, Afonso (Mozambique)"
            reasoning: >
              has depicted peace between the two parties, with a fairly clear picture: live
